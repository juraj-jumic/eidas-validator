name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    name: Build and test (JDK ${{ matrix.java }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        java: [17, 21]
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          cache: maven

      # Runs the unit tests (generated PAdES material through the engine) and builds the jar.
      - name: Build
        run: mvn -B --no-transfer-progress package

      # Smoke-test the packaged CLI against the committed corpus. Exit codes are part of the
      # contract: 3 no signature, 2 indeterminate, 0 valid, 1 invalid. Trusted lists are off
      # here to keep the job deterministic and network-free; the online test covers them.
      - name: CLI smoke test on corpus
        run: |
          set -u
          jar=target/eidas-validator.jar
          anchor=corpus/generated/test-signer.pem
          at=2026-10-11T12:00:00Z
          # The runner's shell is `bash -e`; non-zero exits are expected here, so capture them.
          expect() {
            local want=$1; shift
            local got=0
            java -jar "$jar" --at "$at" --no-trusted-lists "$@" >/dev/null 2>&1 || got=$?
            if [ "$got" -ne "$want" ]; then echo "FAIL: $* -> exit $got, expected $want"; exit 1; fi
            echo "ok ($want): $*"
          }
          expect 3 corpus/generated/unsigned.pdf
          expect 2 corpus/generated/signed-b.pdf
          expect 0 --trust "$anchor" corpus/generated/signed-b.pdf
          expect 1 --trust "$anchor" corpus/generated/signed-b-tampered.pdf
          # Real-world Austrian gazettes: intact, but without trusted lists the chain is unknown.
          expect 2 corpus/public/at-bgbl-I-1-2024-amtssignatur.pdf
          expect 2 corpus/public/at-bgbl-I-1-2026-amtssignatur.pdf

      - name: Upload jar
        if: matrix.java == 17
        uses: actions/upload-artifact@v5
        with:
          name: eidas-validator
          path: |
            target/eidas-validator.jar
            target/lib/
          retention-days: 14
