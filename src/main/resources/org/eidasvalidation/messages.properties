# ---- web interface ---------------------------------------------------------------------
web.title = Check a signed PDF
web.h1 = Check a signed PDF
web.intro = Find out whether a PDF carries a valid electronic signature, who signed it, and whether the signature is qualified under EU rules (eIDAS).
web.privacy = The file is checked on this computer and deleted straight afterwards. Only trusted-list and certificate-status data is fetched from the internet.
web.file = PDF file
web.online = Check certificate revocation status online (CRL/OCSP)
web.online.unavailable = \ — unavailable, the server runs offline
web.submit = Check signatures
web.trust.h = Trust data in use
web.back = Back to the form
web.error.generic.h = Something went wrong
web.error.generic.p = The server hit an unexpected error and could not check the document.
web.error.tooLarge.h = File too large
# {0} = limit in MB
web.error.tooLarge.p = Uploads are limited to {0} MB.
web.error.badRequest.h = Bad request
# {0} = reason
web.error.badRequest.p = The upload could not be read: {0}
web.error.noFile.h = No file received
web.error.noFile.p = Choose a PDF file and submit the form again.
web.error.unreadable.h = This file could not be checked
# {0} = engine message
web.error.unreadable.p = The file is not a PDF the validator can read, so no statement about signatures is possible. Engine message: {0}
web.error.sandbox.h = This file could not be checked safely
web.error.sandbox.p = The parser was stopped while reading this file ({0}). That happens with damaged or hostile PDFs; the check was aborted and the parser restarted. No statement about the signatures is possible.

