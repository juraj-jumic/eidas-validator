# eidas-validator message catalog, English (base bundle; the fallback for every other language).
#
# Wording policy: say what was checked and what was found; never "legally valid".
# Placeholders use java.text.MessageFormat: {0}, {1}. In keys that carry placeholders a literal
# apostrophe must be written as '' (two); elsewhere use the typographic ’ to avoid the question.

format.datetime = d MMMM yyyy, HH:mm 'UTC'

# ---- verdict words ----------------------------------------------------------------------
verdict.VALID = Valid
verdict.INVALID = Invalid
verdict.INDETERMINATE = Undetermined
verdict.NO_SIGNATURE = No signature

# ---- per-signature explanations ---------------------------------------------------------
# {0} = validation time
passed.headline = Valid as of {0}.
passed.detail = The document has not been changed since it was signed, and the signer’s certificate chains to a trusted issuer at that time.

failed.HASH_FAILURE.headline = The document was changed after it was signed.
failed.HASH_FAILURE.detail = The content covered by the signature no longer matches what the signer signed.
failed.HASH_FAILURE.next = Do not rely on this copy. Ask the signer for the original file.
failed.SIG_CRYPTO_FAILURE.headline = The signature does not match the signer’s certificate.
failed.SIG_CRYPTO_FAILURE.detail = The cryptographic signature value could not be verified with the certificate that claims to have produced it.
failed.SIG_CRYPTO_FAILURE.next = Do not rely on this file. Ask the signer to sign it again.
failed.FORMAT_FAILURE.headline = The signature is malformed.
failed.FORMAT_FAILURE.detail = The signature structure does not follow the required format and cannot be checked.
failed.FORMAT_FAILURE.next = Ask the signer to sign the document again with a standards-compliant tool.
failed.REVOKED.headline = The signer’s certificate was revoked before the document was signed.
failed.REVOKED.detail = The certificate authority withdrew the certificate, and the signature was made after that.
failed.REVOKED.next = Treat the signature as invalid. Contact the signer.
failed.EXPIRED.headline = The signer’s certificate had expired when the document was signed.
failed.EXPIRED.detail = The signature was made outside the certificate’s validity period.
failed.EXPIRED.next = Ask the signer to sign again with a current certificate.
failed.NOT_YET_VALID.headline = The signer’s certificate was not yet valid when the document was signed.
failed.NOT_YET_VALID.detail = The signature predates the start of the certificate’s validity period.
failed.NOT_YET_VALID.next = Ask the signer to sign again.
# {0} = sub-indication, {1} = engine messages
failed.default.headline = This signature is not valid.
failed.default.detail = The engine reported {0}. {1}
failed.default.next = Open the technical report for details.

indeterminate.NO_CERTIFICATE_CHAIN_FOUND.headline = The document is intact, but the signer is not linked to any trusted issuer.
indeterminate.NO_CERTIFICATE_CHAIN_FOUND.detail.tl = The signature matches the document, but the signer’s certificate could not be traced to any provider on the EU trusted lists.
indeterminate.NO_CERTIFICATE_CHAIN_FOUND.detail.notl = The signature matches the document, but the signer’s certificate could not be traced to a certificate authority this tool trusts.
indeterminate.NO_CERTIFICATE_CHAIN_FOUND.next.tl = The signer may have used a non-EU or self-issued certificate. Ask the signer which provider issued it.
indeterminate.NO_CERTIFICATE_CHAIN_FOUND.next.notl = No EU trusted list was loaded; run again with trusted lists enabled.
indeterminate.TRY_LATER.headline = The document is intact, but the signer’s certificate status could not be checked.
indeterminate.TRY_LATER.detail = The signature matches the document and the signer’s certificate chains to a trusted provider, but revocation information (CRL or OCSP) was not available, so it is unknown whether the certificate had been withdrawn.
indeterminate.TRY_LATER.next = Run again with network access (--online), or try later.
indeterminate.OUT_OF_BOUNDS_NO_POE.headline = The signer’s certificate is expired, and there is no proof the signature was made earlier.
indeterminate.OUT_OF_BOUNDS_NO_POE.detail = Without a trusted timestamp the tool cannot show that the document was signed while the certificate was still valid.
indeterminate.OUT_OF_BOUNDS_NO_POE.next = Ask the signer for a version with a qualified timestamp, or validate at an earlier date if you have independent proof of when it was signed.
indeterminate.REVOKED_NO_POE.headline = The signer’s certificate was revoked, and there is no proof the signature was made earlier.
indeterminate.REVOKED_NO_POE.detail = Without a trusted timestamp the tool cannot show that the document was signed before the revocation.
indeterminate.REVOKED_NO_POE.next = Treat with caution. Contact the signer.
indeterminate.NO_POE.headline = The signature cannot be placed in time.
indeterminate.NO_POE.detail = No trusted proof of when the signature was made is available.
indeterminate.NO_POE.next = Ask the signer for a timestamped version.
indeterminate.CRYPTO_CONSTRAINTS_FAILURE_NO_POE.headline = The signature uses an algorithm that is no longer considered secure.
indeterminate.CRYPTO_CONSTRAINTS_FAILURE_NO_POE.detail = The algorithm or key length was acceptable at some point, but there is no proof the signature was made while it still was.
indeterminate.CRYPTO_CONSTRAINTS_FAILURE_NO_POE.next = Ask the signer to sign again with a current algorithm.
indeterminate.NO_SIGNING_CERTIFICATE_FOUND.headline = The signer’s certificate is missing from the document.
indeterminate.NO_SIGNING_CERTIFICATE_FOUND.detail = The signature does not include or reference a certificate that can be checked.
indeterminate.NO_SIGNING_CERTIFICATE_FOUND.next = Ask the signer for a version that embeds the certificate.
indeterminate.SIGNED_DATA_NOT_FOUND.headline = The signed content could not be located.
indeterminate.SIGNED_DATA_NOT_FOUND.detail = The signature refers to data that is not present in the file.
indeterminate.SIGNED_DATA_NOT_FOUND.next = Ask the signer for the complete file.
# {0} = sub-indication, {1} = engine messages
indeterminate.default.headline = Could not determine whether this signature is valid.
indeterminate.default.detail = The engine reported {0}. {1}
indeterminate.default.next = Open the technical report for details.

# {0} = indication, {1} = sub-indication
unexpected.headline = Could not determine whether this signature is valid.
unexpected.detail = The engine returned an unexpected outcome ({0}/{1}).
unexpected.next = Open the technical report for details.

# ---- qualification ---------------------------------------------------------------------
qualification.QESIG = Qualified electronic signature: the certificate is qualified and listed on the EU trusted lists, and it was used on a qualified signature creation device.
qualification.QESEAL = Qualified electronic seal: a qualified certificate issued to an organisation, used on a qualified device.
qualification.ADESIG_QC = Advanced signature with a qualified certificate, but no evidence of a qualified signature creation device. Not a qualified electronic signature.
qualification.ADESEAL_QC = Advanced seal with a qualified certificate, but no evidence of a qualified device.
qualification.ADESIG = Advanced signature. The certificate is not qualified under eIDAS.
qualification.ADESEAL = Advanced seal. The certificate is not qualified under eIDAS.
qualification.NOT_ADES = Not an advanced electronic signature: the signature does not meet the baseline requirements.
qualification.UNKNOWN = Not a qualified signature. The certificate is listed on an EU trusted list, but as a service recognised at national level rather than as a qualified certificate issuer, so eIDAS qualification does not apply. See the trusted-list details below.
qualification.NA.tl = Not qualified: the certificate does not chain to any provider listed on the EU trusted lists, so eIDAS qualification does not apply.
qualification.NA.notl = Qualification not determined. No EU trusted list data was available, so whether the certificate is qualified could not be checked.
# {0} = engine qualification name
qualification.INDETERMINATE = Qualification could not be confirmed ({0}): the trusted-list information was incomplete or the signature could not be fully validated.
qualification.other = Qualification: {0}.

# ---- trust summary ---------------------------------------------------------------------
trust.none = none
trust.anchors = trust anchor files given on the command line; no EU trusted lists
# {0} = source, {1} = certificate count
trust.anchors.withCount = {0} ({1} certificate(s))
trust.tl = EU trusted lists (LOTL)
trust.tl.fromCache = EU trusted lists (LOTL), from cache
trust.tl.unavailable = EU trusted lists: not available
trust.tl.unavailable.offline = EU trusted lists: not available (offline, empty cache)
trust.tl.problem.notLoaded = The list of trusted lists could not be loaded.
trust.tl.problem.notLoaded.offline = The list of trusted lists could not be loaded from the cache.
# {0} = source, {1} = LOTL number, {2} = issue date, {3} = signature status, {4} = usable lists, {5} = total lists, {6} = anchors
trust.tl.describe = {0}, LOTL no. {1} issued {2}, signature {3}; {4} of {5} national lists usable, {6} trust anchors
# {0} = sync time
trust.tl.synchronised = ; synchronised {0}
trust.signature.verified = verified
trust.signature.notVerified = NOT verified
# {0} = source, {1} = count
trust.plusAnchors = {0} plus {1} anchor file(s) from the command line

