html.overall.indeterminate.h = Could not be fully verified
html.overall.indeterminate.p = The check could not reach a definite answer for at least one signature. What is missing and what you can do about it is explained below.
html.signatures = Signatures
# {0} = index, {1} = total
html.signature.n = Signature {0} of {1}
# {0} = signer name
html.signature.by = by {0}
html.next = What you can do:
html.tech.format = Format
html.tech.outcome = Outcome
html.tech.qualification = Qualification
html.tech.claimedTime = Claimed signing time
html.tech.claimedTime.none = not stated
html.tech.claimedTime.note = (as claimed by the signer; proven only if timestamped)
html.tech.id = Signature id
html.engineMessages = Engine messages for this signature
html.error = Error:
html.warning = Warning:
html.relied.h = What this check relied on
html.relied.checkedAt = Checked at
html.relied.trust = Trust data
html.relied.revocation = Revocation lookups
html.relied.revocation.online = allowed (CRL/OCSP fetched over the network)
html.relied.revocation.offline = not performed (offline); only revocation data embedded in the document was used
html.relied.engine = Engine
html.relied.notes = Notes on the trust data:
html.scope.h = What was checked, and what was not
html.scope.checked = Checked
html.scope.checked.integrity = That the signed parts of the document are unchanged since signing.
html.scope.checked.value = That each signature value matches the signer’s certificate.
html.scope.checked.chain.tl = That the signer’s certificate chains to a provider on the EU trusted lists, and whether that provider is qualified.
html.scope.checked.chain.notl = That the signer’s certificate chains to one of the trust anchors supplied for this run.
html.scope.checked.revocation.online = Whether the certificates had been revoked, using current CRL/OCSP data.
html.scope.checked.revocation.offline = Revocation status, but only from data embedded in the document.
html.scope.checked.timestamps = Timestamps, where present.
html.scope.notChecked = Not checked
html.scope.notChecked.identity = Who the signer really is beyond what the certificate’s issuer asserts.
html.scope.notChecked.authority = Whether the signer was entitled to sign this document, or what the document means.
html.scope.notChecked.outside = Parts of the document outside the signed byte ranges (for example later annotations), beyond what the engine reports.
html.scope.notChecked.notl = EU trusted lists were not used, so qualification under eIDAS could not be assessed.
html.technical.h = Technical detail
# {0} = report version
html.technical.json = Report as JSON (version {0})
html.technical.engine = Engine report (DSS simple report, XML)
# {0} = engine name
html.footer = This check is informational. It is not a qualified validation service in the sense of the eIDAS Regulation and does not constitute legal advice. Produced by eidas-validator with {0}.

