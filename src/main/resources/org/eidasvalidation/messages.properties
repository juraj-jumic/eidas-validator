html.overall.valid.h = Valid as of {0}
html.overall.valid.one = The signature is intact and the signer’s certificate chains to a trusted issuer at that time. Qualification is stated per signature below.
# {0} = number of signatures
html.overall.valid.many = All {0} signatures are intact and the signers’ certificates chain to trusted issuers at that time. Qualification is stated per signature below.
