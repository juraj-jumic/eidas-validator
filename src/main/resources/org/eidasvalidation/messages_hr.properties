# eidas-validator katalog poruka, hrvatski.
# Pravilo izražavanja: reći što je provjereno i što je utvrđeno; nikada „pravno valjan“.

format.datetime = d. MMMM yyyy., HH:mm 'UTC'

# ---- Ishod ------------------------------------------------------------------------------
verdict.VALID = Valjan
verdict.INVALID = Nevaljan
verdict.INDETERMINATE = Neutvrđeno
verdict.NO_SIGNATURE = Nema potpisa

# ---- Objašnjenja po potpisu -------------------------------------------------------------
passed.headline = Valjan prema stanju na {0}.
passed.detail = Dokument nije mijenjan nakon potpisivanja, a certifikat potpisnika u tom trenutku vodi lancem do pouzdanog izdavatelja.

failed.HASH_FAILURE.headline = Dokument je promijenjen nakon potpisivanja.
failed.HASH_FAILURE.detail = Sadržaj obuhvaćen potpisom više ne odgovara onome što je potpisnik potpisao.
failed.HASH_FAILURE.next = Ne oslanjajte se na ovaj primjerak. Zatražite od potpisnika izvornu datoteku.
failed.SIG_CRYPTO_FAILURE.headline = Potpis ne odgovara certifikatu potpisnika.
failed.SIG_CRYPTO_FAILURE.detail = Kriptografska vrijednost potpisa nije se mogla provjeriti certifikatom koji ju je navodno izradio.
failed.SIG_CRYPTO_FAILURE.next = Ne oslanjajte se na ovu datoteku. Zatražite od potpisnika da je ponovno potpiše.
failed.FORMAT_FAILURE.headline = Potpis je neispravno oblikovan.
failed.FORMAT_FAILURE.detail = Struktura potpisa ne slijedi propisani format i ne može se provjeriti.
failed.FORMAT_FAILURE.next = Zatražite od potpisnika da dokument ponovno potpiše alatom usklađenim s normama.
failed.REVOKED.headline = Certifikat potpisnika bio je opozvan prije potpisivanja dokumenta.
failed.REVOKED.detail = Certifikacijsko tijelo povuklo je certifikat, a potpis je izrađen nakon toga.
failed.REVOKED.next = Smatrajte potpis nevaljanim. Obratite se potpisniku.
failed.EXPIRED.headline = Certifikat potpisnika bio je istekao u trenutku potpisivanja dokumenta.
failed.EXPIRED.detail = Potpis je izrađen izvan razdoblja valjanosti certifikata.
failed.EXPIRED.next = Zatražite od potpisnika da ponovno potpiše važećim certifikatom.
failed.NOT_YET_VALID.headline = Certifikat potpisnika još nije bio valjan u trenutku potpisivanja dokumenta.
failed.NOT_YET_VALID.detail = Potpis prethodi početku razdoblja valjanosti certifikata.
failed.NOT_YET_VALID.next = Zatražite od potpisnika da ponovno potpiše.
failed.default.headline = Ovaj potpis nije valjan.
failed.default.detail = Validacijski mehanizam javlja {0}. {1}
failed.default.next = Pojedinosti potražite u tehničkom izvješću.

indeterminate.NO_CERTIFICATE_CHAIN_FOUND.headline = Dokument je netaknut, ali potpisnik nije povezan ni s jednim pouzdanim izdavateljem.
indeterminate.NO_CERTIFICATE_CHAIN_FOUND.detail.tl = Potpis odgovara dokumentu, ali certifikat potpisnika nije se mogao povezati ni s jednim pružateljem s EU-ovih pouzdanih popisa.
indeterminate.NO_CERTIFICATE_CHAIN_FOUND.detail.notl = Potpis odgovara dokumentu, ali certifikat potpisnika nije se mogao povezati ni s jednim certifikacijskim tijelom kojem ovaj alat vjeruje.
indeterminate.NO_CERTIFICATE_CHAIN_FOUND.next.tl = Potpisnik je možda upotrijebio certifikat izdan izvan EU-a ili samostalno izdan certifikat. Pitajte potpisnika koji je pružatelj izdao certifikat.
indeterminate.NO_CERTIFICATE_CHAIN_FOUND.next.notl = Nijedan EU-ov pouzdani popis nije učitan; pokrenite provjeru ponovno s uključenim pouzdanim popisima.
indeterminate.TRY_LATER.headline = Dokument je netaknut, ali status certifikata potpisnika nije se mogao provjeriti.
indeterminate.TRY_LATER.detail = Potpis odgovara dokumentu i certifikat potpisnika vodi lancem do pouzdanog pružatelja, ali podaci o opozivu (CRL ili OCSP) nisu bili dostupni, pa nije poznato je li certifikat bio povučen.
indeterminate.TRY_LATER.next = Pokrenite provjeru ponovno s pristupom mreži (--online) ili pokušajte kasnije.
indeterminate.OUT_OF_BOUNDS_NO_POE.headline = Certifikat potpisnika je istekao, a nema dokaza da je potpis izrađen ranije.
indeterminate.OUT_OF_BOUNDS_NO_POE.detail = Bez pouzdanog vremenskog žiga alat ne može pokazati da je dokument potpisan dok je certifikat još bio valjan.
indeterminate.OUT_OF_BOUNDS_NO_POE.next = Zatražite od potpisnika inačicu s kvalificiranim vremenskim žigom ili provedite validaciju na raniji datum ako neovisno možete dokazati kada je dokument potpisan.
indeterminate.REVOKED_NO_POE.headline = Certifikat potpisnika je opozvan, a nema dokaza da je potpis izrađen ranije.
indeterminate.REVOKED_NO_POE.detail = Bez pouzdanog vremenskog žiga alat ne može pokazati da je dokument potpisan prije opoziva.
indeterminate.REVOKED_NO_POE.next = Postupajte s oprezom. Obratite se potpisniku.
indeterminate.NO_POE.headline = Potpis se ne može vremenski smjestiti.
indeterminate.NO_POE.detail = Nije dostupan pouzdan dokaz o tome kada je potpis izrađen.
indeterminate.NO_POE.next = Zatražite od potpisnika inačicu s vremenskim žigom.
indeterminate.CRYPTO_CONSTRAINTS_FAILURE_NO_POE.headline = Potpis koristi algoritam koji se više ne smatra sigurnim.
indeterminate.CRYPTO_CONSTRAINTS_FAILURE_NO_POE.detail = Algoritam ili duljina ključa nekoć su bili prihvatljivi, ali nema dokaza da je potpis izrađen dok su to još bili.
indeterminate.CRYPTO_CONSTRAINTS_FAILURE_NO_POE.next = Zatražite od potpisnika da ponovno potpiše aktualnim algoritmom.
indeterminate.NO_SIGNING_CERTIFICATE_FOUND.headline = Certifikat potpisnika nedostaje u dokumentu.
indeterminate.NO_SIGNING_CERTIFICATE_FOUND.detail = Potpis ne sadrži niti upućuje na certifikat koji bi se mogao provjeriti.
indeterminate.NO_SIGNING_CERTIFICATE_FOUND.next = Zatražite od potpisnika inačicu s ugrađenim certifikatom.
indeterminate.SIGNED_DATA_NOT_FOUND.headline = Potpisani sadržaj nije pronađen.
indeterminate.SIGNED_DATA_NOT_FOUND.detail = Potpis upućuje na podatke kojih nema u datoteci.
indeterminate.SIGNED_DATA_NOT_FOUND.next = Zatražite od potpisnika cjelovitu datoteku.
indeterminate.default.headline = Nije se moglo utvrditi je li ovaj potpis valjan.
indeterminate.default.detail = Validacijski mehanizam javlja {0}. {1}
indeterminate.default.next = Pojedinosti potražite u tehničkom izvješću.

unexpected.headline = Nije se moglo utvrditi je li ovaj potpis valjan.
unexpected.detail = Validacijski mehanizam vratio je neočekivani ishod ({0}/{1}).
unexpected.next = Pojedinosti potražite u tehničkom izvješću.

# ---- Kvalifikacija ----------------------------------------------------------------------
qualification.QESIG = Kvalificirani elektronički potpis: certifikat je kvalificiran i naveden na EU-ovim pouzdanim popisima, a upotrijebljen je na kvalificiranom sredstvu za izradu elektroničkog potpisa.
qualification.QESEAL = Kvalificirani elektronički pečat: kvalificirani certifikat izdan organizaciji, upotrijebljen na kvalificiranom sredstvu.
qualification.ADESIG_QC = Napredni elektronički potpis s kvalificiranim certifikatom, ali bez dokaza o kvalificiranom sredstvu za izradu elektroničkog potpisa. Nije kvalificirani elektronički potpis.
qualification.ADESEAL_QC = Napredni elektronički pečat s kvalificiranim certifikatom, ali bez dokaza o kvalificiranom sredstvu.
qualification.ADESIG = Napredni elektronički potpis. Certifikat nije kvalificiran prema uredbi eIDAS.
qualification.ADESEAL = Napredni elektronički pečat. Certifikat nije kvalificiran prema uredbi eIDAS.
qualification.NOT_ADES = Nije napredni elektronički potpis: potpis ne ispunjava osnovne zahtjeve.
qualification.UNKNOWN = Nije kvalificirani potpis. Certifikat je naveden na EU-ovu pouzdanom popisu, ali kao usluga priznata na nacionalnoj razini, a ne kao izdavatelj kvalificiranih certifikata, pa se kvalifikacija prema uredbi eIDAS ne primjenjuje. Vidi pojedinosti iz pouzdanog popisa u nastavku.
qualification.NA.tl = Nije kvalificiran: certifikat ne vodi lancem ni do jednog pružatelja navedenog na EU-ovim pouzdanim popisima, pa se kvalifikacija prema uredbi eIDAS ne primjenjuje.
qualification.NA.notl = Kvalifikacija nije utvrđena. Podaci EU-ovih pouzdanih popisa nisu bili dostupni, pa se nije moglo provjeriti je li certifikat kvalificiran.
qualification.INDETERMINATE = Kvalifikacija se nije mogla potvrditi ({0}): podaci iz pouzdanog popisa bili su nepotpuni ili se potpis nije mogao u cijelosti validirati.
qualification.other = Kvalifikacija: {0}.

