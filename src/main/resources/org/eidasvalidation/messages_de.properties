# eidas-validator Nachrichtenkatalog, Deutsch.
# Formulierungsregel: sagen, was geprüft und was gefunden wurde; nie „rechtsgültig“.

format.datetime = d. MMMM yyyy, HH:mm 'UTC'

# ---- Verdikt ---------------------------------------------------------------------------
verdict.VALID = Gültig
verdict.INVALID = Ungültig
verdict.INDETERMINATE = Unbestimmt
verdict.NO_SIGNATURE = Keine Signatur

# ---- Erklärungen je Signatur ------------------------------------------------------------
passed.headline = Gültig zum Stand {0}.
passed.detail = Das Dokument wurde seit der Signatur nicht verändert, und das Zertifikat der unterzeichnenden Person führt zu diesem Zeitpunkt auf einen vertrauenswürdigen Aussteller zurück.

failed.HASH_FAILURE.headline = Das Dokument wurde nach der Signatur verändert.
failed.HASH_FAILURE.detail = Der von der Signatur abgedeckte Inhalt stimmt nicht mehr mit dem überein, was unterzeichnet wurde.
failed.HASH_FAILURE.next = Verlassen Sie sich nicht auf diese Kopie. Bitten Sie die unterzeichnende Person um die Originaldatei.
failed.SIG_CRYPTO_FAILURE.headline = Die Signatur passt nicht zum Zertifikat der unterzeichnenden Person.
failed.SIG_CRYPTO_FAILURE.detail = Der kryptografische Signaturwert ließ sich mit dem Zertifikat, das ihn erzeugt haben soll, nicht prüfen.
failed.SIG_CRYPTO_FAILURE.next = Verlassen Sie sich nicht auf diese Datei. Bitten Sie um eine erneute Signatur.
failed.FORMAT_FAILURE.headline = Die Signatur ist fehlerhaft aufgebaut.
failed.FORMAT_FAILURE.detail = Die Signaturstruktur entspricht nicht dem erforderlichen Format und kann nicht geprüft werden.
failed.FORMAT_FAILURE.next = Bitten Sie um eine erneute Signatur mit einem standardkonformen Werkzeug.
failed.REVOKED.headline = Das Zertifikat der unterzeichnenden Person war bei der Signatur bereits gesperrt.
failed.REVOKED.detail = Die Zertifizierungsstelle hat das Zertifikat zurückgezogen, und die Signatur wurde danach erstellt.
failed.REVOKED.next = Behandeln Sie die Signatur als ungültig. Wenden Sie sich an die unterzeichnende Person.
failed.EXPIRED.headline = Das Zertifikat der unterzeichnenden Person war bei der Signatur bereits abgelaufen.
failed.EXPIRED.detail = Die Signatur wurde außerhalb des Gültigkeitszeitraums des Zertifikats erstellt.
failed.EXPIRED.next = Bitten Sie um eine erneute Signatur mit einem aktuellen Zertifikat.
failed.NOT_YET_VALID.headline = Das Zertifikat der unterzeichnenden Person war bei der Signatur noch nicht gültig.
failed.NOT_YET_VALID.detail = Die Signatur liegt vor dem Beginn des Gültigkeitszeitraums des Zertifikats.
failed.NOT_YET_VALID.next = Bitten Sie um eine erneute Signatur.
failed.default.headline = Diese Signatur ist nicht gültig.
failed.default.detail = Die Prüfkomponente meldet {0}. {1}
failed.default.next = Einzelheiten finden Sie im technischen Bericht.

indeterminate.NO_CERTIFICATE_CHAIN_FOUND.headline = Das Dokument ist unverändert, aber die unterzeichnende Person ist mit keinem vertrauenswürdigen Aussteller verknüpft.
indeterminate.NO_CERTIFICATE_CHAIN_FOUND.detail.tl = Die Signatur passt zum Dokument, doch das Zertifikat ließ sich auf keinen Anbieter der EU-Vertrauenslisten zurückführen.
indeterminate.NO_CERTIFICATE_CHAIN_FOUND.detail.notl = Die Signatur passt zum Dokument, doch das Zertifikat ließ sich auf keine Zertifizierungsstelle zurückführen, der dieses Werkzeug vertraut.
indeterminate.NO_CERTIFICATE_CHAIN_FOUND.next.tl = Möglicherweise wurde ein Zertifikat von außerhalb der EU oder ein selbst ausgestelltes Zertifikat verwendet. Fragen Sie nach dem ausstellenden Anbieter.
indeterminate.NO_CERTIFICATE_CHAIN_FOUND.next.notl = Es wurde keine EU-Vertrauensliste geladen; prüfen Sie erneut mit aktivierten Vertrauenslisten.
indeterminate.TRY_LATER.headline = Das Dokument ist unverändert, aber der Sperrstatus des Zertifikats konnte nicht geprüft werden.
indeterminate.TRY_LATER.detail = Die Signatur passt zum Dokument und das Zertifikat führt auf einen vertrauenswürdigen Anbieter zurück, doch es lagen keine Sperrinformationen (CRL oder OCSP) vor. Ob das Zertifikat zurückgezogen wurde, ist daher unbekannt.
indeterminate.TRY_LATER.next = Prüfen Sie erneut mit Netzwerkzugang (--online) oder versuchen Sie es später.
indeterminate.OUT_OF_BOUNDS_NO_POE.headline = Das Zertifikat der unterzeichnenden Person ist abgelaufen, und es gibt keinen Nachweis, dass die Signatur früher erstellt wurde.
indeterminate.OUT_OF_BOUNDS_NO_POE.detail = Ohne vertrauenswürdigen Zeitstempel lässt sich nicht zeigen, dass das Dokument während der Gültigkeit des Zertifikats unterzeichnet wurde.
indeterminate.OUT_OF_BOUNDS_NO_POE.next = Bitten Sie um eine Fassung mit qualifiziertem Zeitstempel, oder prüfen Sie zu einem früheren Datum, wenn Sie den Signaturzeitpunkt unabhängig belegen können.
indeterminate.REVOKED_NO_POE.headline = Das Zertifikat der unterzeichnenden Person wurde gesperrt, und es gibt keinen Nachweis, dass die Signatur davor erstellt wurde.
indeterminate.REVOKED_NO_POE.detail = Ohne vertrauenswürdigen Zeitstempel lässt sich nicht zeigen, dass das Dokument vor der Sperrung unterzeichnet wurde.
indeterminate.REVOKED_NO_POE.next = Mit Vorsicht behandeln. Wenden Sie sich an die unterzeichnende Person.
indeterminate.NO_POE.headline = Die Signatur lässt sich zeitlich nicht einordnen.
indeterminate.NO_POE.detail = Es liegt kein vertrauenswürdiger Nachweis des Signaturzeitpunkts vor.
indeterminate.NO_POE.next = Bitten Sie um eine Fassung mit Zeitstempel.
indeterminate.CRYPTO_CONSTRAINTS_FAILURE_NO_POE.headline = Die Signatur verwendet einen Algorithmus, der nicht mehr als sicher gilt.
indeterminate.CRYPTO_CONSTRAINTS_FAILURE_NO_POE.detail = Algorithmus oder Schlüssellänge waren einmal zulässig, doch es gibt keinen Nachweis, dass die Signatur in dieser Zeit erstellt wurde.
indeterminate.CRYPTO_CONSTRAINTS_FAILURE_NO_POE.next = Bitten Sie um eine erneute Signatur mit einem aktuellen Algorithmus.
indeterminate.NO_SIGNING_CERTIFICATE_FOUND.headline = Das Zertifikat der unterzeichnenden Person fehlt im Dokument.
indeterminate.NO_SIGNING_CERTIFICATE_FOUND.detail = Die Signatur enthält oder referenziert kein prüfbares Zertifikat.
indeterminate.NO_SIGNING_CERTIFICATE_FOUND.next = Bitten Sie um eine Fassung, die das Zertifikat einbettet.
indeterminate.SIGNED_DATA_NOT_FOUND.headline = Der signierte Inhalt wurde nicht gefunden.
indeterminate.SIGNED_DATA_NOT_FOUND.detail = Die Signatur verweist auf Daten, die in der Datei nicht vorhanden sind.
indeterminate.SIGNED_DATA_NOT_FOUND.next = Bitten Sie um die vollständige Datei.
indeterminate.default.headline = Ob diese Signatur gültig ist, ließ sich nicht feststellen.
indeterminate.default.detail = Die Prüfkomponente meldet {0}. {1}
indeterminate.default.next = Einzelheiten finden Sie im technischen Bericht.

unexpected.headline = Ob diese Signatur gültig ist, ließ sich nicht feststellen.
unexpected.detail = Die Prüfkomponente lieferte ein unerwartetes Ergebnis ({0}/{1}).
unexpected.next = Einzelheiten finden Sie im technischen Bericht.

# ---- Qualifizierung --------------------------------------------------------------------
qualification.QESIG = Qualifizierte elektronische Signatur: Das Zertifikat ist qualifiziert und auf den EU-Vertrauenslisten geführt, und es wurde auf einer qualifizierten Signaturerstellungseinheit verwendet.
qualification.QESEAL = Qualifiziertes elektronisches Siegel: ein qualifiziertes Zertifikat einer Organisation, verwendet auf einer qualifizierten Einheit.
qualification.ADESIG_QC = Fortgeschrittene Signatur mit qualifiziertem Zertifikat, aber ohne Nachweis einer qualifizierten Signaturerstellungseinheit. Keine qualifizierte elektronische Signatur.
qualification.ADESEAL_QC = Fortgeschrittenes Siegel mit qualifiziertem Zertifikat, aber ohne Nachweis einer qualifizierten Einheit.
qualification.ADESIG = Fortgeschrittene Signatur. Das Zertifikat ist nach eIDAS nicht qualifiziert.
qualification.ADESEAL = Fortgeschrittenes Siegel. Das Zertifikat ist nach eIDAS nicht qualifiziert.
qualification.NOT_ADES = Keine fortgeschrittene elektronische Signatur: Die Signatur erfüllt die Grundanforderungen nicht.
qualification.UNKNOWN = Keine qualifizierte Signatur. Das Zertifikat ist auf einer EU-Vertrauensliste geführt, jedoch als national anerkannter Dienst und nicht als Aussteller qualifizierter Zertifikate; die eIDAS-Qualifizierung trifft daher nicht zu. Siehe die Angaben aus der Vertrauensliste unten.
qualification.NA.tl = Nicht qualifiziert: Das Zertifikat führt auf keinen Anbieter der EU-Vertrauenslisten zurück, die eIDAS-Qualifizierung trifft daher nicht zu.
qualification.NA.notl = Qualifizierung nicht bestimmt. Es lagen keine Daten der EU-Vertrauenslisten vor, daher konnte nicht geprüft werden, ob das Zertifikat qualifiziert ist.
qualification.INDETERMINATE = Die Qualifizierung konnte nicht bestätigt werden ({0}): Die Angaben der Vertrauensliste waren unvollständig oder die Signatur ließ sich nicht vollständig prüfen.
qualification.other = Qualifizierung: {0}.

# ---- Vertrauensdaten -------------------------------------------------------------------
trust.none = keine
trust.anchors = auf der Kommandozeile angegebene Vertrauensanker; keine EU-Vertrauenslisten
trust.anchors.withCount = {0} ({1} Zertifikat(e))
trust.tl = EU-Vertrauenslisten (LOTL)
trust.tl.fromCache = EU-Vertrauenslisten (LOTL), aus dem Zwischenspeicher
trust.tl.unavailable = EU-Vertrauenslisten: nicht verfügbar
trust.tl.unavailable.offline = EU-Vertrauenslisten: nicht verfügbar (offline, leerer Zwischenspeicher)
trust.tl.problem.notLoaded = Die Liste der Vertrauenslisten konnte nicht geladen werden.
trust.tl.problem.notLoaded.offline = Die Liste der Vertrauenslisten konnte nicht aus dem Zwischenspeicher geladen werden.
trust.tl.describe = {0}, LOTL Nr. {1} vom {2}, Signatur {3}; {4} von {5} nationalen Listen nutzbar, {6} Vertrauensanker
trust.tl.synchronised = ; abgeglichen {0}
trust.signature.verified = geprüft
trust.signature.notVerified = NICHT geprüft
trust.plusAnchors = {0} sowie {1} Ankerdatei(en) von der Kommandozeile

