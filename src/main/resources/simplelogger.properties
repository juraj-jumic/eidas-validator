# DSS is chatty at INFO; keep the CLI quiet unless something is wrong.
org.slf4j.simpleLogger.defaultLogLevel=warn
org.slf4j.simpleLogger.logFile=System.err
org.slf4j.simpleLogger.showDateTime=false
org.slf4j.simpleLogger.showThreadName=false

# Trusted-list loading: per-list download and parsing problems are collected into the report's
# trust summary, so the engine's own warnings about them are redundant on the console.
org.slf4j.simpleLogger.log.eu.europa.esig.dss.service.http.commons.FileCacheDataLoader=error
org.slf4j.simpleLogger.log.eu.europa.esig.dss.validation.job.runnable.AbstractAnalysis=error
org.slf4j.simpleLogger.log.eu.europa.esig.dss.tsl.parsing.LOTLParsingTask=error
org.slf4j.simpleLogger.log.eu.europa.esig.dss.tsl.sync.TrustedListCertificateSourceSynchronizer=error
# A few legacy certificates on national lists are malformed; DSS skips them and says so for each.
org.slf4j.simpleLogger.log.eu.europa.esig.dss.spi.security.DSSSecurityFactory=error
org.slf4j.simpleLogger.log.eu.europa.esig.dss.tsl.function.converter.DigitalIdentityListTypeConverter=error
org.slf4j.simpleLogger.log.eu.europa.esig.dss.spi.QcStatementUtils=error
# Per-signature findings (missing revocation data, baseline-profile deviations) are already in
# the report's indication, sub-indication and engine messages.
org.slf4j.simpleLogger.log.eu.europa.esig.dss.spi.validation.SignatureValidationContext=error
org.slf4j.simpleLogger.log.eu.europa.esig.dss.cades.validation.CAdESBaselineRequirementsChecker=error
org.slf4j.simpleLogger.log.eu.europa.esig.dss.pades.validation.PAdESBaselineRequirementsChecker=error
