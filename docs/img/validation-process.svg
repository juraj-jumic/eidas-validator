<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="810" viewBox="0 0 1200 810" role="img" aria-labelledby="t d">
  <title id="t">How a signature is validated, step by step</title>
  <desc id="d">A pipeline of eight validation steps from parsing the document to deciding qualification, with the three possible outcomes on the right: total passed, indeterminate and total failed, each with typical reasons.</desc>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #1e293b; }
    .h { font-size: 26px; font-weight: 700; }
    .sub { font-size: 15px; fill: #64748b; }
    .k { font-size: 12.5px; font-weight: 700; fill: #64748b; letter-spacing: .08em; }
    .num { font-size: 15px; font-weight: 700; fill: #ffffff; }
    .st { font-size: 15.5px; font-weight: 700; }
    .sb { font-size: 13px; fill: #334155; }
    .oc { font-size: 15px; font-weight: 700; }
    .ob { font-size: 12.5px; fill: #334155; }
    .mono { font-size: 12px; font-family: Consolas, "Courier New", monospace; fill: #475569; white-space: pre; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="810" fill="#f8fafc"/>
  <text x="48" y="54" class="h">Validation, step by step</text>
  <text x="48" y="80" class="sub">The procedure of ETSI EN 319 102-1, which EU DSS implements. Every step can stop the pipeline with a reason the report names.</text>

  <!-- pipeline -->
  <g transform="translate(48 110)">
    <text x="0" y="0" class="k">THE PIPELINE</text>

    <g transform="translate(0 16)">
      <rect width="640" height="66" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="30" cy="33" r="15" fill="#475569"/><text x="30" y="38" class="num" text-anchor="middle">1</text>
      <text x="58" y="28" class="st">Parse the file and find every signature</text>
      <text x="58" y="50" class="sb">PDF structure, signature dictionaries, ByteRanges, incremental updates after signing.</text>
    </g>
    <path d="M320 82 V96" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

    <g transform="translate(0 98)">
      <rect width="640" height="66" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="30" cy="33" r="15" fill="#475569"/><text x="30" y="38" class="num" text-anchor="middle">2</text>
      <text x="58" y="28" class="st">Check format and structure</text>
      <text x="58" y="50" class="sb">Required signed attributes present, algorithms recognised, profile identified (B-B, B-T, B-LT, B-LTA).</text>
    </g>
    <path d="M320 164 V178" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

    <g transform="translate(0 180)">
      <rect width="640" height="66" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="30" cy="33" r="15" fill="#475569"/><text x="30" y="38" class="num" text-anchor="middle">3</text>
      <text x="58" y="28" class="st">Verify integrity</text>
      <text x="58" y="50" class="sb">Recompute the hash over the ByteRange, verify the signature value with the signer’s public key.</text>
    </g>
    <path d="M320 246 V260" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

    <g transform="translate(0 262)">
      <rect width="640" height="66" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="30" cy="33" r="15" fill="#475569"/><text x="30" y="38" class="num" text-anchor="middle">4</text>
      <text x="58" y="28" class="st">Identify the signing certificate and build the chain</text>
      <text x="58" y="50" class="sb">Match signing-certificate-v2, then follow issuer links up to a trust anchor on the trusted lists.</text>
    </g>
    <path d="M320 328 V342" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

    <g transform="translate(0 344)">
      <rect width="640" height="66" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="30" cy="33" r="15" fill="#475569"/><text x="30" y="38" class="num" text-anchor="middle">5</text>
      <text x="58" y="28" class="st">Check revocation for every certificate in the chain</text>
      <text x="58" y="50" class="sb">CRL or OCSP, embedded or fetched; the answer must cover the time the signature is being judged at.</text>
    </g>
    <path d="M320 410 V424" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

    <g transform="translate(0 426)">
      <rect width="640" height="66" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="30" cy="33" r="15" fill="#475569"/><text x="30" y="38" class="num" text-anchor="middle">6</text>
      <text x="58" y="28" class="st">Establish time: proofs of existence</text>
      <text x="58" y="50" class="sb">Timestamps, themselves validated, fix the earliest time the signature is known to have existed.</text>
    </g>
    <path d="M320 492 V506" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

    <g transform="translate(0 508)">
      <rect width="640" height="66" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <circle cx="30" cy="33" r="15" fill="#475569"/><text x="30" y="38" class="num" text-anchor="middle">7</text>
      <text x="58" y="28" class="st">Apply the validation policy</text>
      <text x="58" y="50" class="sb">Acceptable algorithms and key sizes at that time, required attributes, certificate constraints.</text>
    </g>
    <path d="M320 574 V588" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>

    <g transform="translate(0 590)">
      <rect width="640" height="66" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="1.5"/>
      <circle cx="30" cy="33" r="15" fill="#15803d"/><text x="30" y="38" class="num" text-anchor="middle">8</text>
      <text x="58" y="28" class="st">Determine qualification (ETSI TS 119 615)</text>
      <text x="58" y="50" class="sb">Trusted-list service type and status at signing time, QC statements, QSCD evidence.</text>
    </g>
  </g>

  <!-- outcomes -->
  <g transform="translate(736 110)">
    <text x="0" y="0" class="k">THE THREE POSSIBLE ANSWERS</text>

    <g transform="translate(0 16)">
      <rect width="416" height="150" rx="10" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
      <text x="18" y="30" class="oc" fill="#15803d">TOTAL_PASSED</text>
      <text x="18" y="54" class="ob">Every step succeeded. The document is intact, the chain</text>
      <text x="18" y="72" class="ob">reaches a trust anchor, nothing was revoked at the time that</text>
      <text x="18" y="90" class="ob">matters, and the policy is satisfied.</text>
      <text x="18" y="118" class="ob" font-weight="700">The validator says: Valid as of &lt;time&gt;.</text>
      <text x="18" y="136" class="ob">Qualification is reported separately and can still be “not qualified”.</text>
    </g>

    <g transform="translate(0 186)">
      <rect width="416" height="238" rx="10" fill="#fffbeb" stroke="#b45309" stroke-width="2"/>
      <text x="18" y="30" class="oc" fill="#b45309">INDETERMINATE</text>
      <text x="18" y="54" class="ob">Nothing is proven wrong, but something needed is missing.</text>
      <text x="18" y="72" class="ob">The sub-indication says what:</text>
      <text x="18" y="98" class="mono" font-size="11.5">NO_CERTIFICATE_CHAIN_FOUND  no trusted issuer found</text>
      <text x="18" y="118" class="mono" font-size="11.5">TRY_LATER                   revocation data unavailable</text>
      <text x="18" y="138" class="mono" font-size="11.5">OUT_OF_BOUNDS_NO_POE        expired, no earlier proof</text>
      <text x="18" y="158" class="mono" font-size="11.5">REVOKED_NO_POE              revoked, no earlier proof</text>
      <text x="18" y="178" class="mono" font-size="11.5">CRYPTO_CONSTRAINTS_FAILURE  algorithm now too weak</text>
      <text x="18" y="206" class="ob" font-weight="700">The validator says what is missing and what you can do.</text>
      <text x="18" y="224" class="ob">Often fixable: go online, load trusted lists, obtain a timestamped copy.</text>
    </g>

    <g transform="translate(0 444)">
      <rect width="416" height="226" rx="10" fill="#fef2f2" stroke="#b91c1c" stroke-width="2"/>
      <text x="18" y="30" class="oc" fill="#b91c1c">TOTAL_FAILED</text>
      <text x="18" y="54" class="ob">Something is definitely wrong. No amount of extra data</text>
      <text x="18" y="72" class="ob">will change the answer.</text>
      <text x="18" y="98" class="mono">HASH_FAILURE        document changed after signing</text>
      <text x="18" y="118" class="mono">SIG_CRYPTO_FAILURE  signature value does not verify</text>
      <text x="18" y="138" class="mono">FORMAT_FAILURE      signature structure malformed</text>
      <text x="18" y="158" class="mono">REVOKED             revoked before the proven signing time</text>
      <text x="18" y="178" class="mono">EXPIRED             signed outside certificate validity</text>
      <text x="18" y="210" class="ob" font-weight="700">The validator says: do not rely on this copy.</text>
    </g>
  </g>

  <text x="48" y="792" class="sub">Steps 3 to 7 can also end in INDETERMINATE or TOTAL_FAILED. A result is always given for a specific validation time; the report states it.</text>
</svg>
