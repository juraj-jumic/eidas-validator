<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="640" viewBox="0 0 1200 640" role="img" aria-labelledby="t d">
  <title id="t">Why a changed document fails verification</title>
  <desc id="d">Top row: signing hashes the document and transforms the hash with the private key. Middle row: verifying recomputes the hash and compares it with the hash recovered from the signature using the public key. Bottom row: a single changed byte yields a completely different hash and the comparison fails.</desc>
  <style>
    text { font-family: "Segoe UI", "Helvetica Neue", Arial, sans-serif; fill: #1e293b; }
    .h { font-size: 26px; font-weight: 700; }
    .sub { font-size: 15px; fill: #64748b; }
    .k { font-size: 12.5px; font-weight: 700; fill: #64748b; letter-spacing: .08em; }
    .box { font-size: 14px; font-weight: 700; }
    .bb { font-size: 12.5px; fill: #475569; }
    .mono { font-size: 12.5px; font-family: Consolas, "Courier New", monospace; }
    .res { font-size: 15px; font-weight: 700; }
    .side { font-size: 13.5px; fill: #334155; }
    .sidek { font-size: 14px; font-weight: 700; }
  </style>
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L10 5 L0 10 z" fill="#64748b"/>
    </marker>
  </defs>
  <rect width="1200" height="640" fill="#f8fafc"/>
  <text x="48" y="54" class="h">Tamper protection: why a changed document cannot pass</text>
  <text x="48" y="80" class="sub">The signature does not “lock” the file. It is a mathematical statement about the file’s exact bytes that anyone can re-check.</text>

  <!-- row 1: signing -->
  <g transform="translate(48 112)">
    <text x="0" y="0" class="k">1  SIGNING, ON THE SIGNER’S DEVICE</text>
    <g transform="translate(0 18)">
      <rect width="170" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="14" y="26" class="box">Document bytes</text>
      <text x="14" y="46" class="bb">the signed ByteRange</text>
    </g>
    <path d="M172 50 H204" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
    <g transform="translate(206 18)">
      <rect width="150" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="14" y="26" class="box">Hash</text>
      <text x="14" y="46" class="bb">SHA-256</text>
    </g>
    <path d="M358 50 H390" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
    <g transform="translate(392 18)">
      <rect width="190" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
      <text x="14" y="26" class="box">Digest</text>
      <text x="14" y="48" class="mono" fill="#2563eb">a9f3 7c1e 02b4 ... 5d</text>
    </g>
    <path d="M584 50 H616" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
    <g transform="translate(618 18)">
      <rect width="200" height="64" rx="8" fill="#ffffff" stroke="#15803d" stroke-width="1.5"/>
      <text x="14" y="26" class="box" fill="#15803d">Private key</text>
      <text x="14" y="46" class="bb">never leaves the QSCD</text>
    </g>
    <path d="M820 50 H852" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
    <g transform="translate(854 18)">
      <rect width="250" height="64" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
      <text x="14" y="26" class="box" fill="#15803d">Signature value</text>
      <text x="14" y="46" class="bb">stored in /Contents with the certificate</text>
    </g>
  </g>

  <!-- row 2: verifying, intact -->
  <g transform="translate(48 242)">
    <text x="0" y="0" class="k">2  VERIFYING, ON ANY MACHINE, ANY TIME LATER</text>
    <g transform="translate(0 18)">
      <rect width="170" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="14" y="26" class="box">Document bytes</text>
      <text x="14" y="46" class="bb">same ByteRange</text>
    </g>
    <path d="M172 50 H204" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
    <g transform="translate(206 18)">
      <rect width="150" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="14" y="26" class="box">Hash</text>
      <text x="14" y="46" class="bb">recomputed</text>
    </g>
    <path d="M358 50 H390" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
    <g transform="translate(392 18)">
      <rect width="190" height="64" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.5"/>
      <text x="14" y="26" class="box">Digest</text>
      <text x="14" y="48" class="mono" fill="#2563eb">a9f3 7c1e 02b4 ... 5d</text>
    </g>

    <g transform="translate(618 18)">
      <rect width="200" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
      <text x="14" y="26" class="box" fill="#2563eb">Public key</text>
      <text x="14" y="46" class="bb">from the certificate</text>
    </g>
    <path d="M854 50 H820" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
    <g transform="translate(854 18)">
      <rect width="250" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="14" y="26" class="box">Signature value</text>
      <text x="14" y="46" class="bb">read from the file</text>
    </g>
    <path d="M616 50 H584" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
    <!-- compare -->
    <path d="M487 82 V108" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
    <g transform="translate(392 110)">
      <rect width="190" height="40" rx="8" fill="#f0fdf4" stroke="#15803d" stroke-width="2"/>
      <text x="14" y="26" class="res" fill="#15803d">digests equal: intact</text>
    </g>
  </g>

  <!-- row 3: verifying, altered -->
  <g transform="translate(48 430)">
    <text x="0" y="0" class="k">3  THE SAME CHECK ON A COPY WHERE ONE BYTE WAS CHANGED</text>
    <g transform="translate(0 18)">
      <rect width="170" height="64" rx="8" fill="#fff7ed" stroke="#b45309" stroke-width="1.5"/>
      <text x="14" y="26" class="box">Document bytes</text>
      <text x="14" y="46" class="mono" fill="#b45309">1,000 → 9,000</text>
    </g>
    <path d="M172 50 H204" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
    <g transform="translate(206 18)">
      <rect width="150" height="64" rx="8" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
      <text x="14" y="26" class="box">Hash</text>
      <text x="14" y="46" class="bb">recomputed</text>
    </g>
    <path d="M358 50 H390" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
    <g transform="translate(392 18)">
      <rect width="190" height="64" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="1.5"/>
      <text x="14" y="26" class="box">Digest</text>
      <text x="14" y="48" class="mono" fill="#b91c1c">7c02 e8aa 91f0 ... 3b</text>
    </g>
    <g transform="translate(618 18)">
      <rect width="200" height="64" rx="8" fill="#ffffff" stroke="#2563eb" stroke-width="1.5"/>
      <text x="14" y="26" class="box" fill="#2563eb">Public key</text>
      <text x="14" y="46" class="bb">still recovers a9f3 ...</text>
    </g>
    <path d="M616 50 H584" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
    <path d="M487 82 V108" stroke="#64748b" stroke-width="1.5" marker-end="url(#ar)"/>
    <g transform="translate(392 110)">
      <rect width="372" height="40" rx="8" fill="#fee2e2" stroke="#b91c1c" stroke-width="2"/>
      <text x="14" y="26" class="res" fill="#b91c1c">digests differ: TOTAL_FAILED / HASH_FAILURE</text>
    </g>
  </g>

  <!-- side panel -->
  <g transform="translate(880 350)">
    <rect width="272" height="238" rx="10" fill="#ffffff" stroke="#cbd5e1" stroke-width="1.5"/>
    <text x="18" y="30" class="sidek">Why it cannot be faked</text>
    <text x="18" y="56" class="side">Changing one bit changes about half</text>
    <text x="18" y="74" class="side">the digest. Finding a second document</text>
    <text x="18" y="92" class="side">with the same SHA-256 digest is beyond</text>
    <text x="18" y="110" class="side">any known computing capability.</text>
    <text x="18" y="138" class="side">Producing a matching signature value</text>
    <text x="18" y="156" class="side">for a new digest needs the private key,</text>
    <text x="18" y="174" class="side">which sits on the signer’s device.</text>
    <text x="18" y="202" class="side">Additions after signing land outside the</text>
    <text x="18" y="220" class="side">ByteRange: a validator reports them.</text>
  </g>
  <text x="48" y="618" class="sub">The hash comparison is pure arithmetic. Trust only enters when asking whose public key this is, which is what certificates and trusted lists answer.</text>
</svg>
